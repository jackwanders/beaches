<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The time rail, which is the app's own mark: the dining day as one divided
    pill — sand breakfast, turquoise lunch, slate gap, blue dinner, violet late
    night — with the now-marker sitting in dinner. Original artwork; the
    resort's logos are mirrored for venue rows only and are not used here.
  -->
  <rect width="512" height="512" rx="112" fill="#0B2B3C"/>
  <clipPath id="rail">
    <rect x="76" y="208" width="360" height="96" rx="48"/>
  </clipPath>
  <g clip-path="url(#rail)">
    <rect x="76"  y="208" width="90" height="96" fill="#E8DCC4"/>
    <rect x="166" y="208" width="81" height="96" fill="#39C7C0"/>
    <rect x="247" y="208" width="27" height="96" fill="#7C93A1"/>
    <rect x="274" y="208" width="81" height="96" fill="#4B93DD"/>
    <rect x="355" y="208" width="81" height="96" fill="#7A6BD0"/>
    <rect x="163" y="208" width="6" height="96" fill="#0B2B3C"/>
    <rect x="244" y="208" width="6" height="96" fill="#0B2B3C"/>
    <rect x="271" y="208" width="6" height="96" fill="#0B2B3C"/>
    <rect x="352" y="208" width="6" height="96" fill="#0B2B3C"/>
  </g>
  <rect x="304" y="184" width="12" height="144" rx="6" fill="#F7FAFA"/>
</svg>
